name: Verify Wubi Rules

on:
  push:
    branches: [main]
    paths:
      - '*.txt'
  pull_request:
    branches: [main]
    paths:
      - '*.txt'
  workflow_dispatch:

jobs:
  verify:
    name: 五笔文法自动校验
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 运行规则校验器
        run: |
          python3 rule_verify.py wubi86_basic.txt
